name: Windows CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 15
    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: "1"
      DOTNET_NOLOGO: "true"
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up .NET
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: Restore
        run: dotnet restore AgentKick75.slnx

      - name: Verify formatting
        run: dotnet format AgentKick75.slnx --no-restore --verify-no-changes

      - name: Build
        run: dotnet build AgentKick75.slnx -c Release --no-restore

      - name: Test
        run: >-
          dotnet test AgentKick75.slnx -c Release --no-build
          --logger "trx;LogFilePrefix=windows"
          --results-directory artifacts/test-results

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: windows-test-results
          path: artifacts/test-results
          if-no-files-found: ignore
